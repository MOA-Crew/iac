name: Terraform CD (dev)

# PR  → terraform plan을 돌려 결과를 PR 코멘트로 남김 (읽기/계획만)
# dev 머지(push) → terraform apply. 단, GitHub Environment 'dev-apply'의 수동 승인 통과 후 실행.
# 인증은 GitHub OIDC로 AWS IAM Role을 assume (장기 액세스 키 없음).

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/cd-terraform.yml"
  push:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/cd-terraform.yml"

permissions:
  id-token: write # OIDC 토큰 발급
  contents: read
  pull-requests: write # plan 결과 코멘트

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::850919911012:role/sw-hub-dev-gha-terraform
  TF_VAR_aws_profile: "" # CI에서는 profile 비우고 OIDC 임시자격증명 사용
  TF_VAR_cloudflare_account_id: ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_name: ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_NAME }}
  # prod/dev hostname 둘 다 plan/apply에 필요. PR plan은 환경 시크릿을 못 읽어 repo 시크릿으로 둔다(공개 도메인이라 민감도 낮음).
  TF_VAR_cloudflare_hostname_prod: ${{ secrets.TF_VAR_CLOUDFLARE_HOSTNAME_PROD }}
  TF_VAR_cloudflare_hostname_dev: ${{ secrets.TF_VAR_CLOUDFLARE_HOSTNAME_DEV }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false 2>&1 | tee plan_output.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/environments/dev/plan_output.txt';
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(plan 출력 없음)';
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (생략됨)';
            const body = `### Terraform Plan \`${{ steps.plan.outcome }}\`\n<details><summary>plan 상세</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev-apply # ← 수동 승인 게이트 (Settings > Environments)
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
