---
- name: Install zram-tools
  apt:
    name: zram-tools
    state: present
    update_cache: yes

- name: Configure zram swap
  copy:
    dest: /etc/default/zramswap
    mode: "0644"
    content: |
      ALGO=zstd
      PERCENT={{ zram_percent }}
      PRIORITY={{ zram_priority }}
  register: zram_config

- name: Persist vm.swappiness
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-zram-swappiness.conf
    mode: "0644"
    content: |
      vm.swappiness={{ vm_swappiness }}
  register: swappiness_config

- name: Apply vm.swappiness immediately
  ansible.builtin.command: "sysctl -w vm.swappiness={{ vm_swappiness }}"
  changed_when: swappiness_config.changed

- name: Enable zramswap service
  systemd:
    name: zramswap.service
    enabled: yes

- name: Restart zramswap service
  systemd:
    name: zramswap.service
    state: restarted
  when: zram_config.changed
