---
- name: Validate Redis bind safety
  ansible.builtin.assert:
    that:
      - redis_bind_address != '0.0.0.0' or (redis_password is defined and redis_password | length > 0)
    fail_msg: >-
      Redis를 0.0.0.0에 바인딩하려면 redis_password를 반드시 설정해야 합니다.
      dev 기본값은 127.0.0.1:6379 바인딩입니다.

- name: Create Redis compose directory
  ansible.builtin.file:
    path: "{{ redis_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Redis Docker Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ redis_project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: redis_compose_file
  no_log: "{{ redis_password is defined and redis_password | length > 0 }}"

- name: Start Redis with Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ redis_project_dir }}"
  register: redis_compose_up
  changed_when: >-
    'Started' in redis_compose_up.stdout or
    'Created' in redis_compose_up.stdout or
    'Recreated' in redis_compose_up.stdout or
    'Pulling' in redis_compose_up.stdout or
    'Downloaded newer image' in redis_compose_up.stdout

- name: Wait for Redis port on configured bind address
  ansible.builtin.wait_for:
    host: "{{ redis_bind_address }}"
    port: "{{ redis_port }}"
    timeout: 30

- name: Verify Redis responds to PING
  ansible.builtin.command: >-
    docker exec {{ redis_container_name }} redis-cli
    {% if redis_password is defined and redis_password | length > 0 %}-a {{ redis_password }}{% endif %}
    ping
  register: redis_ping
  changed_when: false
  no_log: "{{ redis_password is defined and redis_password | length > 0 }}"

- name: Assert Redis PING response
  ansible.builtin.assert:
    that:
      - redis_ping.stdout is search('PONG')
    fail_msg: "Redis 컨테이너가 PING에 PONG으로 응답하지 않았습니다."
