# Terraform이 자동 생성. 직접 편집하지 말 것 — 다음 apply에서 덮어써짐.
# 재생성: terraform apply (in terraform/environments/dev)
#
# 아래는 첫 apply 전 CI syntax-check 통과용 placeholder. 실제 IP/키 경로는 apply가 채운다.

all:
  vars:
    ansible_user: ubuntu

    # 공유 RDS 접속 정보 (비밀번호 제외)
    postgres_rds_host: REPLACED_BY_TERRAFORM
    postgres_rds_port: 5432
    postgres_rds_user: moa_admin
  children:
    prod_app:
      vars:
        ansible_ssh_private_key_file: "{{ inventory_dir }}/../../../moa-prod.pem"
        moa_env: prod
        postgres_rds_database: moa_prod
      hosts:
        moa-prod:
          ansible_host: 203.0.113.10
    dev_app:
      vars:
        ansible_ssh_private_key_file: "{{ inventory_dir }}/../../../moa-dev.pem"
        moa_env: dev
        postgres_rds_database: moa_dev
      hosts:
        moa-dev:
          ansible_host: 203.0.113.11
